name: Shademanga Sync & Scraper

on:
  schedule:
    # Se ejecuta todos los días a las 8:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite que lo dispares manualmente desde la pestaña "Actions" en GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests cloudscraper
    - name: Run sync script
      run: python scripts/sync_catalog.py

    - name: Optional - Commit results back to repo if data changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.io"
        git add output/ || true
        git commit -m "Auto-update catalog data [skip ci]" || echo "No changes to commit"
        git push || echo "No changes to push"
